# Zebra Scanner Android app — one codebase, one config file per company (clients/<name>.properties)
#
# What gets built
#   - Run pipeline (web) -> pick CLIENT (name or "all") and ENV (dev | stage | prod | all)
#   - Push to master     -> dev builds of every client
#   - Tag vX.Y.Z         -> prod builds of every client + GitLab Release
#   - Tag <client>-vX.Y.Z -> prod build of that client + GitLab Release
#   APKs are named <client>-<env>-<version>.apk under dist/.
#   Every build is also published to Redmine (ci/redmine-publish.sh): tags as a released version,
#   branch pushes as "Nightly". Set REDMINE_API_KEY (masked) and REDMINE_PROJECT in CI/CD variables.
#
# Versioning
#   - Tags give versionName X.Y.Z; other pipelines "<last tag>-dev.<pipeline>" (0.0.0-dev.N without tags).
#   - versionCode = 100 + pipeline IID, so every newer build installs over the previous one.
#     (Updating in place also needs the same signing key: app/keystore/debug.keystore.)

stages:
  - build
  - publish
  - release

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_CMDLINE_TOOLS: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GIT_DEPTH: "0"  # full history so git describe finds the last tag
  CLIENT:
    value: "all"
    description: "Company: a name from clients/*.properties, or all"
  ENV:
    value: "prod"
    description: "Environment: dev, stage, prod or all"

build-apk:
  stage: build
  image: eclipse-temurin:21-jdk
  tags:
    - develop
  cache:
    key: android-sdk-gradle
    paths:
      - .android-sdk/
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip git curl > /dev/null
    # Android SDK command-line tools (cached between pipelines)
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -sSL -o /tmp/cmdline-tools.zip "$ANDROID_CMDLINE_TOOLS"
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    # gradlew is stored with CRLF line endings and without the exec bit
    - sed -i 's/\r$//' gradlew && chmod +x gradlew
    # Version from the tag, or from the latest tag plus the pipeline number
    - |
      git fetch --tags --quiet || true
      if [ -n "$CI_COMMIT_TAG" ]; then
        # v1.2.0 -> all clients; luna-v1.2.0 -> only luna
        case "$CI_COMMIT_TAG" in
          v*) export CLIENT=all ;;
          *-v*) export CLIENT="${CI_COMMIT_TAG%%-v*}" ;;
        esac
        export ENV=prod
        export APP_VERSION_NAME="${CI_COMMIT_TAG##*v}"
      else
        if [ "$CI_PIPELINE_SOURCE" = "push" ]; then export CLIENT=all ENV=dev; fi
        LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
        export APP_VERSION_NAME="${LAST_TAG#v}-dev.${CI_PIPELINE_IID}"
      fi
      export APP_VERSION_CODE=$((100 + CI_PIPELINE_IID))
      echo "APP_VERSION_NAME=$APP_VERSION_NAME" | tee version.env
      echo "APP_VERSION_CODE=$APP_VERSION_CODE" | tee -a version.env
  script:
    - echo "CLIENT=$CLIENT ENV=$ENV"
    - bash ci/build-variants.sh
  artifacts:
    name: "zebra-scanner-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/
    reports:
      dotenv: version.env
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^([a-z]+-)?v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

publish-redmine:
  stage: publish
  image: alpine:3.20
  tags:
    - develop
  needs:
    - job: build-apk
      artifacts: true
  # The APKs stay in build-apk's artifacts either way; a Redmine problem shows here without failing the pipeline
  allow_failure: true
  # One publish per Redmine project at a time, so two pipelines never replace each other's Nightly files
  resource_group: redmine-$REDMINE_PROJECT
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
  timeout: 30m
  rules:
    - if: $REDMINE_API_KEY == null || $REDMINE_PROJECT == null
      when: never
    - if: $CI_COMMIT_TAG =~ /^([a-z]+-)?v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - apk add --no-cache -q curl jq git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - APP_NAME="Zebra Scanner" sh ci/redmine-publish.sh

release:
  stage: release
  # Pinned: newer images switch to glab, which fails with 404 on this self-hosted GitLab
  image: registry.gitlab.com/gitlab-org/release-cli:v0.18.0
  tags:
    - develop
  # APKs are already in build-apk's artifacts; a failed Release page shouldn't fail the pipeline
  allow_failure: true
  needs:
    - job: build-apk
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^([a-z]+-)?v\d+\.\d+\.\d+$/
  script:
    - echo "Releasing $CI_COMMIT_TAG (versionName $APP_VERSION_NAME, versionCode $APP_VERSION_CODE)"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Zebra Scanner $CI_COMMIT_TAG"
    description: "Zebra Scanner $APP_VERSION_NAME (versionCode $APP_VERSION_CODE)"
    assets:
      links:
        - name: "APKs (all clients in this release)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/browse/dist?job=build-apk"
          link_type: package
