name: Screenshots
on: [push, workflow_dispatch]
jobs:
  shots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {p: zebrascanner-Music, pkg: com.example.zebrascanner, pref: zebra_scanner_prefs, body: '<boolean name="is_logged_in" value="true" /><string name="access_token">x</string>'}
          - {p: ZabraScannerAndroid, pkg: com.yourcompany.zabrascannerandroid, pref: zabra_scanner_prefs, body: '<string name="auth_token">x</string><string name="username">test</string><string name="email">test@test.com</string>'}
          - {p: Slouzebrascanapp, pkg: com.yourcompany.zebrascanapp, pref: '', body: ''}
          - {p: solutionsappszebra, pkg: com.zebra.sloutions.solutionsappszebra, pref: '', body: ''}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build
        continue-on-error: true
        working-directory: ${{ matrix.p }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon 2>&1 | tail -60 | tee ../build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: APK-${{ matrix.p }}
          path: ${{ matrix.p }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash shoot.sh "${{ matrix.p }}" "${{ matrix.pkg }}" "${{ matrix.pref }}" '${{ matrix.body }}'
      - if: always()
        run: mkdir -p shots/${{ matrix.p }} && cp build-log.txt shots/${{ matrix.p }}/ || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.p }}
          path: shots/${{ matrix.p }}
