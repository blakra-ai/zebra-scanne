name: Build APKs
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        p: [scanner-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build
        working-directory: ${{ matrix.p }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | grep -vE "^> Task" | tee ../build-log.txt; test -n "$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null)"
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ matrix.p }}
          path: ${{ matrix.p }}/app/build/outputs/apk/debug/*.apk
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-${{ matrix.p }}
          path: build-log.txt
